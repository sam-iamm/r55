[package]
name = "hydra-l2-signal-service"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
deploy = []
interface-only = []
mpt = ["ethereum-triedb", "rlp", "primitive-types", "trie-db", "hash-db"]

[dependencies]
contract-derive = { path = "../../contract-derive" }
eth-riscv-runtime = { path = "../../eth-riscv-runtime" }
alloy-core = { version = "1.3.1", default-features = false }
alloy-sol-types = { version = "1.3.1", default-features = false }
ethereum-triedb = { git = "https://github.com/polytope-labs/hyperbridge", default-features = false, optional = true }
rlp = { version = "0.6", default-features = false, optional = true }
primitive-types = { version = "0.13", default-features = false, optional = true }
trie-db = { version = "=0.30.0", default-features = false, optional = true }
hash-db = { version = "0.16", default-features = false, optional = true }

[build-dependencies]
# host-only; enables std for Alloy macro chain, not linked into runtime
alloy-primitives = { version = "1.3.1", default-features = true }
alloy-dyn-abi    = { version = "1.3.1", default-features = true }
alloy-sol-types  = { version = "1.3.1", default-features = true }

[dev-dependencies]
hex-literal = "0.3"

[[bin]]
name = "runtime"
path = "src/lib.rs"

[[bin]]
name = "deploy"
path = "src/lib.rs"
required-features = ["deploy"]

[profile.release]
lto = true
opt-level = "z"