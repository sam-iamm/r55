[package]
name = "hydra-l2-signal-service"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
deploy = []
interface-only = []

[dependencies]
contract-derive = { git = "https://github.com/sam-iamm/r55.git" }
eth-riscv-runtime = { git = "https://github.com/sam-iamm/r55.git" }

alloy-core = { version = "1.3.1", default-features = false }
alloy-sol-types = { version = "1.3.1", default-features = false }

[[bin]]
name = "runtime"
path = "src/lib.rs"

[[bin]]
name = "deploy"
path = "src/lib.rs"
required-features = ["deploy"]

[profile.release]
lto = true
opt-level = "z"